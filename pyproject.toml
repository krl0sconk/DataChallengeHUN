[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hun"
version = "0.1.0"
description = "Predicción de flujo de pacientes - Data Challenge HUN 2026 (Hospital Universidad del Norte)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Equipo Data Challenge HUN 2026" }]
dependencies = [
    "pandas",
    "numpy",
    "scikit-learn",
    "plotly",
    "python-dotenv",
    "requests",
    "matplotlib",
    "seaborn",
    "pyarrow",
    "holidays",
    "python-dateutil",
    "lightgbm",
]

[project.optional-dependencies]
notebooks = ["jupyter"]
bd = ["sqlalchemy>=2.0", "psycopg[binary]>=3.1"]
dev = ["pytest", "ruff", "pre-commit", "nbstripout"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
